[project]
name = "vlanverify"
version = "0.1.1"
description = "Verifies that VLAN network isolation actually holds in practice, for Cyber Essentials Plus style audits."
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Stable State Consulting Ltd"}]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "click>=8.1",
]

[project.urls]
Homepage = "https://www.vlanverify.com"
Repository = "https://github.com/rosscooney/vlanverify"

[project.scripts]
vlanverify = "vlanverify.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vlanverify*"]

[tool.setuptools.package-data]
vlanverify = ["templates/*.j2"]
